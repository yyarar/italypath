# ---------------------------------------------------------------
# KAPSAM DIŞI BIRAKILANLAR (veri setinin eksiksizliği kanıtlansın diye kayıtlı —
# derin araştırmada tekrar "keşfedilip" yanlışlıkla eklenmesinler diye)
# ---------------------------------------------------------------
excluded_items:
  - name: "Filosofia e storia delle scienze umane e sociali"
    reason: "UNIBG portalında 'Study language: combined Italian/English' olarak listeleniyor — tam İngilizce değil"
  - name: "Text Sciences and Culture Enhancement in the Digital Age (LM-43)"
    reason: "Karma İtalyanca/İngilizce eğitim dili — tam İngilizce değil"
  - name: "Tüm lisans (laurea triennale) programları (21 adet)"
    reason: "discover.unibg.it/bachelor'a göre hepsi İtalyanca eğitim veriyor; tam İngilizce lisans programı UNIBG'de bulunmuyor"
  - name: "\"Business Administration, Professional and Managerial Accounting\" ve \"Management, Marketing & Finance\" (arama snippet'lerinde İngilizce görünen isimler)"
    reason: "Muhtemelen sırasıyla İtalyanca 'Economia aziendale...' programının çevirisi ve IMM'nin eski adı — doğrudan okunabilir resmi sayfada teyit edilmeden ayrı program olarak EKLENMEMELİ"

# ---------------------------------------------------------------
# YÜRÜTME AYARLARI (/research-deep bunları okur)
# ---------------------------------------------------------------
execution:
  batch_size: 3          # aynı anda en fazla 3 paralel agent (kullanıcı tercihi)
  items_per_agent: 1     # her agent tek programı derinlemesine araştırır
  output_dir: "./results"
