# University of Bergamo (UNIBG) — İngilizce eğitim veren lisans ve yüksek lisans
# programlarının admission requirements araştırması
# Oluşturulma: 2026-09-05 | Kaynak kısıtı: sadece resmi unibg.it sayfaları (+ apply.unibg.it, discover.unibg.it)

topic: "UNIBG İngilizce eğitim veren lisans ve yüksek lisans programları — admission requirements (2026/2027)"

scope:
  source_restriction: "Sadece unibg.it resmi sayfaları (apply.unibg.it, discover.unibg.it, en.unibg.it, www.unibg.it, ls-*.unibg.it program siteleri dahil)"
  academic_year: "2026/2027 öncelikli; bilgi yoksa en güncel resmi yıl kullanılır ve notlanır. NOT: 5 Eylül 2026 itibarıyla 2026/27 başvuru dönemi kapanmış görünüyor — 2027/28 tarihleri henüz yayınlanmamış olabilir, doğrulanacak"
  language_scope: "Sadece TAM İngilizce eğitim veren programlar dahil edilir. Kısmen İngilizce/İtalyanca karma programlar (aşağıda excluded_items) hariç tutulur"
  note_program_specific_dates: "Programların kendine özel admission tarihleri olabiliyor; her programın kendi ls-*.unibg.it sayfası esas alınmalı"
  bot_protection_warning: "Çoğu unibg.it alt alanı (en.unibg.it, www.unibg.it, ls-*.unibg.it) Cloudflare/AWS WAF insan doğrulaması arkasında olabilir. Derin araştırma agent'ları bu sayfalara erişemezse arama motoru önbelleği/snippet kullanmalı ve source_access_status alanına not düşmeli"

research_guidelines:
  primary_source: "Her programın apply.unibg.it/courses/course/<id> sayfası + kendi ls-*.unibg.it/en sitesi birlikte kontrol edilmeli; apply.unibg.it uluslararası başvuru kurallarını, ls-*.unibg.it akademik/müfredat detaylarını verir"
  program_name_confusion_warning: "UNIBG program adları zaman içinde değişmiş (örn. IMM eski adı IMEF, daha eski MMF/MAFIB). DreamApply kaydı ile canlı program sitesi FARKLI isim/subdomain kullanabilir — ikisi de kontrol edilip alias olarak not düşülmeli"
  access_type_distinction: "Programların çoğu open access (accesso libero); Clinical Psychology limited/selective access (accesso programmato) — admission kuralları yapısal olarak farklı, karıştırılmamalı"
  application_rounds: "UNIBG uluslararası ön-değerlendirme genelde 2 turlu: 1. tur sadece open-access programlar, 2. tur open-access + limited-access. Tarihler yıldan yıla değişir, doğrulanacak"

# ---------------------------------------------------------------
# ITEMS — her tam İngilizce program ayrı araştırma nesnesi
# access_type: open = accesso libero | limited = accesso programmato (selective)
# status: active = güncel dönemde açık görünüyor | uncertain = uluslararası/İngilizce başvuruya açık olup olmadığı doğrulanacak
# ---------------------------------------------------------------

