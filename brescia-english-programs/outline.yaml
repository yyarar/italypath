execution:
  batch_size: 5
  items_per_agent: 2
  output_dir: "./results"
  note: "9 program, 5 paralel ajan x ~2 program. Deep research'te her ajan önce resmi sayfaya doğrudan erişim dener; Cloudflare engeline takılırsa uncertainty_notes'a düşer."
