topic: "University of Catania (UNICT) - English-taught bachelor's and master's programmes: admission requirements"
topic_tr: "Catania Üniversitesi (UNICT) İngilizce eğitim veren lisans ve yüksek lisans programları: başvuru koşulları"
source_scope:
  - "Only official unict.it pages/PDFs (main site + department sites, e.g. dfa.unict.it, dicar.unict.it, dieei.unict.it, dsps.unict.it, di3a.unict.it, dei.unict.it, chirmed.unict.it)"
priority_academic_year: "2026/2027"
fallback_rule: "If 2026/2027 admission info is not yet published for a given field, use the most recent official academic year available and record the year used in data_academic_year."

