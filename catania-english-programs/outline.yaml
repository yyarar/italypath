  # -- Single-cycle degree (laurea magistrale a ciclo unico), English-taught --
  - id: catania-lm41-medicine-surgery
    name: "Medicine and Surgery"
    program_name: "Medicine and Surgery"
    degree_class: "LM-41 R"
    level: single-cycle
    department: "Dept. of Medical and Surgical Sciences and Advanced Technologies (Chirmed)"
    seed_url: "https://www.chirmed.unict.it/en/courses/lm-41-eng/admission"
    notes: >
      Only English-taught programme reachable directly from high school.
      Follows a DIFFERENT admission regime from the other 10 programmes: national numerus
      clausus via Universitaly, not the UNICT public selection call. 2026/27: 80 places,
      entrance test 29 Sept 2026, Universitaly registration 26 Aug - 9 Sept 2026 (15:00).
      Also check the 2026 pre-enrolment cap notice (D.R. 2092/2026) which may block late
      Universitaly registrations for a given cycle.

excluded_items:
  - program_name: "Relazioni internazionali (International Trade Relations)"
    degree_class: "LM-52 R"
    reason: "Official 2026/27 catalogue lists teaching language as 'italiano e inglese' (mixed), not fully English-taught - excluded per scope (only fully English-taught programmes)."
  - program_name: "(all Bachelor's / laurea triennale programmes)"
    reason: "Confirmed negative finding: UNICT publishes no English-taught Bachelor's degree programmes. All laurea triennale courses are Italian-taught and require Italian B2 or CISIA L2 >= 40/72. Documented here so this isn't re-researched as a gap."

admission_process_notes:
  - "Two parallel, structurally different admission routes exist for the 10 master's programmes: (1) non-EU public selection call (D.R. 392/2026), deadline 17 Mar 2026 23:59, portal studenti.smartedu.unict.it; (2) EU/equated-citizens pre-evaluation webform, deadline 30 Jun 2026, portal webform.unict.it. Each programme's page must be checked for both routes."
  - "Medicine and Surgery follows a third, separate national process via Universitaly (numerus clausus), unrelated to the two routes above."
  - "Per-programme non-EU seat quotas found during preliminary search are from the 2025/26 press release and must be reverified against the 2026/27 call annex."

execution:
  batch_size: 3
  items_per_agent: 1
  output_dir: "./catania-english-programs/results"
