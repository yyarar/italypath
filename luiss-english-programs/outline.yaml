topic: "Luiss Guido Carli (Roma) - Ingilizce egitim veren lisans ve yuksek lisans programlari ve admission requirements"
topic_slug: luiss-english-programs
created: 2026-09-04

scope:
  allowed_domains:
    - luiss.it            # canonical; luiss.edu 301 -> luiss.it/en
    - apply.luiss.it      # DreamApply basvuru portali (resmi)
    - pathwayprogrammes.luiss.it  # Foundation Programme portali (resmi)
  notes: >
    luiss.edu artik luiss.it/en adresine yonleniyor. Kaynak olarak luiss.it kullanilacak,
    luiss.edu linkleri stale sayilacak.
  included: "Ingilizce ogretim yapan degree programmes (bachelor + master). Kismi Ingilizce olanlar ayrica isaretlenir."
  excluded: >
    Italyanca-only programlar (Economics and Management, Political Science, Giurisprudenza LMG-01);
    Business School / Postgraduate School Level I-II master ve LL.M. programlari (degree degil).
  academic_year_policy: >
    ONEMLI DEGISIKLIK: Luiss su anda 2027/2028 admission bilgisini yayinliyor.
    2026/2027 dongusu KAPANDI (master kayit son 15 Haziran 2026, bachelor kayit 22 Temmuz 2026).
    Bu nedenle "en guncel resmi yil" = 2027/2028 kabul edilir ve birincil kaynak odur.
    2026/2027 verisi bulunursa ikincil/arsiv olarak kaydedilir, academic_year alaninda belirtilir.
    Tam admission notice'lar bachelor icin Ekim 2026, master icin Kasim 2026'dan itibaren yayinlanir.

