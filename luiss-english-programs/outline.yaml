execution:
  batch_size: 5
  items_per_agent: 3
  output_dir: ./results
  output_format: json_per_item
  agent_model: sonnet
  notes: >
    17 item / 3 = 6 agent gorevi, 5'erli iki dalgada calistirilir.
    Her agent kendi programlarinin resmi sayfasi + ilgili admission notice sayfasini okur,
    results/<item_id>.json uretir.

verified_facts:
  # 2026-09-05 tarihinde resmi program sayfalarindan dogrulandi
  tuition_2027_2028:
    standard_master: "15.000 EUR / yil (Marketing, Strategic Management, International Relations, Data Science and Management, Economics Institutions and Financial Markets, Global Management and Politics)"
    management_and_finance: "17.000 EUR / yil"
    correction_note: >
      Ilk brief'te yazilan 16.000 / 18.000 rakamlari YANLISTI. Bu rakamlar master admission
      sayfalarindaki bir SSS blogundan geliyor ve metin bozuk ("The one-off annual fee is
      EUR 16,000 for the first year and EUR 18,000 for the Bachelor's degree programmes in
      Management and Finance" - master'i "Bachelor" diye yaziyor). Program sayfalari birincil
      kaynak kabul edildi. Kasim 2026'da 2027/2028 admission notice yayinlaninca tekrar bakilmali.
    regional_tax: "Lazio Bolgesi ogrenci refah vergisi ayrica; tutar Haziran/Temmuz 2026'da belirlenecek."

research_status:
  completed: 2026-09-05
  items_done: 17
  items_total: 17
  total_source_quotes: 320
  avg_quotes_per_item: 18.8
  missing_fields: 0
  weakest_item: "Law for Global Challenges (4 alinti / 26 belirsiz) - Luiss'te program sayfasi yayinlanmadigi icin, arastirma eksigi degil."
  known_luiss_site_inconsistencies:
    - "Management sayfasi major isimlerini iki farkli sekilde veriyor (tanitim metni vs ders plani sekmeleri)."
    - "Government and Public Affairs ucret cumlesinde kendi adi yerine 'International Relations' yaziyor (kopyala-yapistir hatasi)."
    - "Master admission SSS blogu master programlarina 'Bachelor's degree programmes' diyor ve yanlis ucret veriyor (16.000/18.000)."
    - "International Relations genel sayfasi 2027/2028'i 'yakinda' derken alt sayfalar tarihleri yayinlamis."
    - "RoME major'i Luiss Test ve GMAT/GRE sayfalarinda listelenmiyor; kendi ayri GRE/GMAT+mulakat sureci var."
  recheck_after: "Kasim 2026 - 2027/2028 master admission notice yayinlaninca ucret ve tarihler tekrar dogrulanmali."
