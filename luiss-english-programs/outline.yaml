      Katalogda artik yok (URL 404). Government and Public Affairs (LM-62) icine alindigi
      DOGRULANAMADI - sadece guclu bir ihtimal. Bkz. ms-government-public-affairs notu.
  - name: "Law (single-cycle LMG-01)"
    reason: "Italyanca. Ingilizce hukuk secenegi Global Law (lisans)."
  - name: "Political Science / Economics and Management (bachelor)"
    reason: "Italyanca ogretim."
  - name: "Law LL.M. / postgraduate masters"
    reason: "Degree programme degil (Level I/II master, Business School). Kapsam disi."

