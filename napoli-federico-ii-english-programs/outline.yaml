# ---------------------------------------------------------------
# KAPSAM DIŞI BIRAKILANLAR (veri setinin eksiksizliği kanıtlansın diye kayıtlı)
# ---------------------------------------------------------------
excluded_items:
  - name: "SEAS 4.0 — Sustainable Ship and Shipping 4.0"
    reason: >
      Derin araştırma sonucu çıkarıldı (Kerem onayı, 2026-08-30). İki sebep: (1) artık aktif
      kabul almıyor — EACEA fonu 4 dönem için verilmişti (2021/22–2024/25), hepsi tükenmiş;
      sitede "NO Applications for A.Y. 25/26" yazıyor, son kohort Mart 2026'da mezun oluyor.
      (2) Laurea/Laurea Magistrale derece sınıfı sistemi dışında ("Master universitario di
      II livello", 90 ECTS) — lisans/yüksek lisans ayrımına oturmuyor. Tam araştırma çıktısı
      arşiv amaçlı excluded_results/other-seas40-erasmus-mundus.json içinde saklanıyor.
  - name: "Biology and Ecology of the Marine Environment and Sustainable Use of Marine Resources (LM-6)"
    reason: "Discontinued — sayfa hâlâ ENG etiketli ama başlıkta 'Corso attivo fino all'A.A. 2020/2021' yazıyor. Yerini Marine Biology and Aquaculture aldı (listede var)."
  - name: "Innovation and International Management (LM-77 R)"
    reason: "İsim İngilizce ama resmi dil etiketi 'Lingua ITA' — false positive"
  - name: "Ingegneria dell'Automazione e Robotica"
    reason: "İtalyanca program; sadece 2. yıl elective'lerin bir kısmı (18 CFU) İngilizce — 'sadece birkaç İngilizce ders' kategorisi, kapsam dışı"
  - name: "Economia e Commercio"
    reason: "İtalyanca lisans; opsiyonel İngilizce pathway var ama tam curriculum/track niteliğinde değil — kapsam dışı"
  - name: "Giurisprudenza (LMG/01)"
    reason: "İtalyanca; ~11 İngilizce elective + hukuk İngilizcesi zorunluluğu var ama program İtalyanca — kapsam dışı"
  - name: "Nursing and Midwifery Sciences – Midwifery Track"
    reason: "2026/27 için yeni ama eğitim dili İtalyanca; basında yanlışlıkla İngilizce programlarla birlikte anılmış"

# ---------------------------------------------------------------
# YÜRÜTME AYARLARI (/research-deep bunları okur)
# ---------------------------------------------------------------
execution:
  batch_size: 5          # aynı anda en fazla 5 paralel agent (limit güvenliği)
  items_per_agent: 1     # her agent tek programı derinlemesine araştırır
  output_dir: "./results"
