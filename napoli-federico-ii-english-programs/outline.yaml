# Napoli Federico II Üniversitesi (University of Naples Federico II) — İngilizce eğitim veren
# lisans ve yüksek lisans programlarının admission requirements araştırması
# Oluşturulma: 2026-08-30 | Kaynak kısıtı: sadece resmi unina.it sayfaları

topic: "Napoli Federico II Üniversitesi İngilizce eğitim veren lisans ve yüksek lisans programları — admission requirements"

scope:
  source_restriction: "Sadece unina.it resmi sayfaları (orientamento.unina.it, international.unina.it, departman/program alt siteleri unina.it altında veya UNINA tarafından resmi olarak işletiliyorsa dahil)"
  academic_year: "2026/2027 öncelikli; bilgi yoksa en güncel resmi yıl kullanılır ve uncertainty_notes'ta belirtilir"
  program_type_scope: >
    3 tür 'İngilizce program' ayrımı yapıldı ve KARAR verildi:
    (1) Baştan sona bağımsız İngilizce program — DAHİL
    (2) İtalyanca isimli bir programın içindeki İngilizce curriculum/track (diploma İtalyanca
        program adıyla çıkar) — DAHİL, ama program_name alanında hem İngilizce curriculum adı
        hem de gerçek diploma adı (İtalyanca) açıkça belirtilir, uncertainty_notes'ta da tekrarlanır
    (3) Ağırlıklı İtalyanca program içinde sadece birkaç İngilizce ders/elective — HARİÇ
        (bkz. excluded_items)
  note_program_specific_dates: "Programların kendine özel admission tarihleri olabiliyor; her programın kendi sayfası + varsa ayrı program web sitesi (örn. dieti.unina.it altındaki alt siteler) esas alınmalı"
  catalogue_reliability_warning: >
    international.unina.it/international-courses-catalogue TEK BAŞINA GÜVENİLİR DEĞİL: eksik
    programlar var (örn. Hospitality Management EN, Aerospace Engineering), kapanmış bir program
    hâlâ İngilizce etiketiyle sitede duruyor, ve bağımsız İngilizce dereceyle İtalyanca derece
    içindeki İngilizce curriculum'u ayırt etmiyor. orientamento.unina.it'teki program bazlı
    sayfalar (Language / Degree class / Admission alanları) birincil doğrulama kaynağı olmalı.

research_guidelines:
  cross_cutting_sources: >
    Bunlar program SAYFALARINDA genelde YOK ama her programın application_deadline_*,
    required_documents, entry_exam_or_test alanlarını doldurmak için mutlaka kontrol edilmeli:
    - Universitaly ön kayıt (UNINA kendi son tarihi ayrı, ulusal vize son tarihi ayrı)
    - "Semestre filtro / semestre aperto" hub'ı (unina.it/it/didattica/offerta-formativa/semestre-filtro)
      — Legge 26/2025 sonrası eski ulusal tıp sınavının yerini aldı
    - "Corsi a numero programmato" bandi + graduatorie sayfası — gerçek çağrı metinleri ve
      AB dışı kontenjanları buradaki rektörlük kararnamelerinde (örn. DR/2026/2379) yayınlanıyor
    - Guida all'iscrizione (harç rehberi) — non-EU öğrenciler harç katkısından tamamen muaf,
      sadece bölgesel vergi + damga pulu ödüyor; bu bilgi tuition_or_fees_link alanına not düşülmeli
    - SegrePass (segrepass1.unina.it) — yabancı uyruklu öğrenciler bu online sistemi
      KULLANAMIYOR, Segreterie Studenti'ye şahsen kayıt olmaları gerekiyor
    - CISIA / TOLC-I kayıt sistemi — yurt dışında ikamet eden AB dışı adaylar normal
      telematik başvurudan MUAF, bunun yerine Universitaly üzerinden planlanan ayrı bir
      sınava giriyor
  open_question_flag: >
    KRİTİK ÇÖZÜLMEMİŞ SORU: İngilizce Medicine and Surgery (ENG) ve Veterinary Medicine
    programları "semestre filtro" ulusal sürecine mi giriyor yoksa ayrı bir uluslararası
    başvuru yoluna mı sahip? Bu iki programın deep-research aşamasında bu çelişki AÇIKÇA
    araştırılmalı ve çözülemezse uncertainty_notes'ta en görünür şekilde işaretlenmeli.
  degree_awarded_vs_program_name: >
    "Curriculum/track" olarak işaretli programlarda (bkz. items altında curriculum_of alanı)
    mezuniyet diploması İtalyanca ana program adıyla çıkıyor. program_name alanına hem
    İngilizce curriculum adı hem parantez içinde gerçek İtalyanca diploma adı yazılmalı.
  date_format: "Tarihler ISO (YYYY-MM-DD) formatına normalize edilecek; kaynak sayfadaki orijinal format source_quotes içinde korunur."

