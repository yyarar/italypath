# outline.yaml — research items + execution config
topic: "University of Perugia (UNIPG) English-taught bachelor & master programmes — admission requirements"
topic_slug: "perugia-english-programs"
university: "Università degli Studi di Perugia (UNIPG)"
academic_year_target: "2026/2027"
academic_year_fallback: "2025/2026"
generated_at: "2026-09-05"

scope_warning: >
  UNIPG (unipg.it) and the University for Foreigners of Perugia / Università per
  Stranieri di Perugia (unistrapg.it) are TWO SEPARATE INSTITUTIONS. Only unipg.it
  and its department subdomains (ing.unipg.it, econ.unipg.it, etc.) are in scope.
  Any unistrapg.it source must be discarded.

source_of_item_list:
  pages:
    - "https://www.unipg.it/en/ects/courses-entirely-taught-in-english?view=held_in"
    - "https://www.unipg.it/en/ects/courses-taught-in-italian-with-curriculum-taught-in-english?view=held_in"
    - "https://www.unipg.it/en/ects/courses-taught-in-italian-with-some-modules-taught-in-english?view=held_in"
  note: >
    UNIPG publishes three tiers on its own ECTS catalogue: (1) entirely taught in
    English, (2) Italian-named degree with a fully-English curriculum inside it, and
    (3) Italian degree with only some modules in English. Tier 3 is OUT OF SCOPE for
    this research (not an English-taught programme). A first verification pass
    (2026-09-05, web-search-agent) checked each Tier-1/Tier-2 listing against the
    actual 2026/27 course catalogue and found UNIPG's own classification page is
    unreliable: of 16 programmes listed as Tier 1 or Tier 2, only 8 items below
    survived verification. Deep-research agents must RE-VERIFY module language against
    the live ECTS catalogue page (idcorso=XXXX) for every item, not just trust the
    classification page.

shared_reference_pages:
  how_to_apply: "https://www.unipg.it/en/international-students/students-wishing-to-enroll/how-to-apply"
  becoming_a_unipg_student: "https://www.unipg.it/en/international-students/becoming-a-unipg-student"
  language_requirements: "https://www.unipg.it/en/international-students/becoming-a-unipg-student/language-requirements"
  study_documents_cimea: "https://www.unipg.it/en/international-students/becoming-a-unipg-student/list-of-study-documents"
  tuition_fees_scholarships: "https://www.unipg.it/en/international-students/becoming-a-unipg-student/tuition-fees-and-scholarships"
  enrollment_procedures: "https://www.unipg.it/en/international-students/becoming-a-unipg-student/enrollment-procedures"
  general_enrollment_requirements: "https://www.unipg.it/en/courses/general-enrollment-requirements"
  faq: "https://www.unipg.it/en/faq"
  restricted_access_courses: "https://www.unipg.it/didattica/corsi-a-numero-programmato/corsi-di-laurea?view=elenco"
  pica_portal_pattern: "https://pica.cineca.it/unipg/2026-visa-03 (programme-specific PICA call code varies — deep-research agent must find the exact call code per item)"
  tuition_regulation: "https://www.unipg.it/files/statuto-regolamenti/regolamenti/reg-contribuzione-studentesca.pdf"
  flat_tax_country_brackets: "https://www.unipg.it/files/pagine/1996/elenco-paesi-fascia-flat_23_24.pdf"
  flat_tax_amounts: "https://www.unipg.it/files/pagine/1996/flattax_amount-of-fees.pdf"
  administrative_deadlines_2026_27: "https://www.unipg.it/files/pagine/1996/administrative-deadlines-a.y.-2026-2027.pdf"
  adisu_umbria_scholarships: "https://www.adisu.umbria.it/ (2026/27 bando deadline 2 Sept 2026 12:00 — already passed; per-band euro amounts not retrievable at research time, site refused connections)"
  fee_note: >
    Tuition €150-2,200/year via a 17-band ISEE table (F1-F17). Non-EU / foreign-income
    students skip ISEE and choose either a fixed "Fascia FLAT" tied to their home
    country's UNDP Human Development classification (4 brackets, e.g. VERY HIGH
    HD=€1,000/yr, HIGH HD=€800/yr — Turkey is classified HIGH HD per UNIPG's own
    country list) or "ISEEU Parificato" via an affiliated CAF. Declaration window
    3 Aug-20 Oct 2026 (late to 1 Mar 2027, surcharges apply); missing the 28 Feb
    deadline entirely defaults the student to the maximum band (F17, ~€2,096).
    No-tax exemption at ISEE <=€22,000 (first-year students only need to meet the
    ISEE + enrolment-duration conditions). MAECI scholarship holders and disabled
    students (L.104 or >=66% invalidity) are fully exempt from COA. Merit-based fee
    reductions (up to €300) generally require an Italian-issued diploma and so
    mostly do not apply to international students admitted on a foreign diploma.
  note: >
    Non-EU-abroad applicants go through PICA (pica.cineca.it/unipg/...) with
    PROGRAMME-SPECIFIC deadlines, not one university-wide date. Confirmed 2026/27
    PICA groups (source: unipg.it/en/international-students/becoming-a-unipg-student,
    updated 3 Sept 2026):
      - Civil Engineering (both curricula) + Geology for Energy Resources ->
        2026-visa-02, until 30 Sept 2026 12:00 — STILL OPEN as of 2026-09-05.
      - Medicine/Vet/Dental + health professions + BSc Informatics + Primary
        Education + Building Eng-Architecture + Rehabilitation Sciences ->
        2026-visa-04, until 6 Aug 2026 — CLOSED.
      - Engineering Management (BSc + MSc) -> 2026-visa-06, until 21 Aug 2026 —
        CLOSED.
      - All other programmes (general window, incl. presumably Quant. Finance &
        Data Science for Economics, Agri. & Env. Biotech, Med/Vet/Forensic
        Biotech, and the newly-added English-curriculum items unless stated
        otherwise) -> 2026-visa-03, 29 May-7 June 2026 — CLOSED.
    EU/legally-resident applicants apply via PICA too but from 1 July 2026 (no
    published closing date). Bachelor/single-cycle open-access enrolment closes 20
    October 2026; open-access master enrolment closes 1 March 2027. Since it is now
    2026-09-05, only Civil Engineering and Geology for Energy Resources still have
    an open non-EU window — deep-research agents should capture BOTH the 2026/27
    dates (for the record) and flag in uncertainty_notes that 2027/28 dates will not
    be published until spring 2027.
  entry_test: >
    CEnT-S (CISIA English-language entry test) went live November 2025, replacing
    the English-language TOLC-I/TOLC-E/TOLC-F for UNIPG. 55 questions, 110 minutes,
    €55, valid one academic year. Deep-research agents must check whether each
    bachelor item accepts TOLC-I, CEnT-S, or both, and note any SAT/ACT alternative.

