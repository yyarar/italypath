excluded_candidates:
  - name: "Engineering Management — First cycle, old code L082 (class L-8/L-9)"
    reason: "Phasing-out cohort of the same programme as L0615 — only Year 3 courses remain, no new intake. Not a separate active option."
  - name: "Relazioni internazionali (M1441, LM-52 R)"
    reason: "On UNIPG's English-curriculum list but verified to have NO English curriculum at all, despite being widely cited elsewhere as English-taught."
  - name: "Ingegneria meccanica (M0617, LM-33)"
    reason: "Failed Tier-2 verification."
  - name: "Ingegneria elettronica (M0620, LM-29)"
    reason: "Failed Tier-2 verification."
  - name: "Ingegneria informatica e robotica (M0619, LM-32)"
    reason: "Failed Tier-2 verification."
  - name: "Ingegneria ambientale (M0724, LM-35 R)"
    reason: "Failed Tier-2 verification."
  - name: "Ingegneria dei materiali e dei processi sostenibili (M0726, LM-53)"
    reason: "Failed Tier-2 verification. Also has an unresolved campus conflict: listed at Terni but catalogue page shows Perugia."
  - name: "Scienze chimiche (M0103, LM-54 R) — the other 3 curricula (Chimica Fisica, Chimica Inorganica per l'Energia e la Catalisi, Chimica Organica)"
    reason: "Italian-taught. Only the TCCM and Energy and Sustainability curricula (see items list) are English."
  - name: "Scienze della terra (M0414, LM-74 R) — Curriculum 1 (Geologia Applicata alla Salvaguardia e alla Pianificazione del Territorio)"
    reason: "Italian-taught. Only Curriculum 2, Geosciences for Environmental Sustainability (see items list), has English modules."
  - name: "Scienze della alimentazione (M1340, LM-61 R)"
    reason: "Failed Tier-2 verification."
  - name: "Programmazione e gestione di sistemi informatici (L067, L-P03)"
    reason: "Failed Tier-2 verification."
  - name: "Ottica e optometria (L069 / L0410, L-30 R)"
    reason: "Only the 'English Language' course itself is in English — not a genuine English curriculum."
  - name: "Medicine and Surgery, Odontoiatria e Protesi Dentaria, Medicina Veterinaria"
    reason: >
      Confirmed NOT offered in English at UNIPG, and UNIPG does NOT participate in
      IMAT (IMAT only admits to English-taught medical courses, which UNIPG has
      none of). Under Legge 26/2025 + D.Lgs. 71/2025, admission is now via a
      compulsory Italian-language "semestre filtro" (3 exams: Biologia, Chimica,
      Fisica, 18 CFU total, pass threshold 18/30 — NOT 18/31, a common error).
      Non-EU applicants abroad compete in a small separate national quota (UNIPG
      2026/27: Medicine 18 [Perugia]+4 [Terni], Dentistry 5, Veterinary 2) but still
      sit the exams in Italian. 2026/27 portal deadlines already closed (Universitaly
      3 Aug 2026 18:00, UNIPG SOL 6 Aug 2026 23:59)."
  - name: "Relazioni internazionali (M1441, LM-52 R) — old English track \"Migration, Globalisation and World Governance\""
    reason: >
      This English-taught curriculum existed under the PRE-REFORM course code
      (idcorso 261) and no longer appears in the 2026/27 ECTS catalogue. The
      reformed M1441 (idcorso 7826, active 2025/26+) has only two curricula
      (cooperazione internazionale e governance globale; conflitti internazionali)
      and NEITHER is fully English (both are majority-Italian with some English
      modules). scipol.unipg.it still has a stale English page advertising
      "Migration, Globalisation and World Governance... delivered entirely in
      English" referencing a 2021-22 catalogue — this is outdated marketing copy,
      not current. Confirms the earlier exclusion of M1441 from the items list.

global_uncertainty_notes:
  - "B1 vs B2 English level conflict: UNIPG's study-documents page states B1 for undergraduate English-taught programmes, while individual programme/language pages state B2. Deep-research agents must record BOTH values with source URLs, not silently pick one."
  - "SAT/ACT acceptance for Engineering Management (bachelor) is unconfirmed at the faculty level: the department page (ing.unipg.it) lists SAT >=700/1600 (maths >=350/800) and ACT >=16/36 (maths >=15/36) as accepted, but the faculty-wide admission-test page only lists TOLC-I and CEnT-S. Flag as a conflict, do not resolve by guessing."
  - "Ingegneria dei materiali e dei processi sostenibili (M0726) has a campus conflict: listed at Terni in one place, Perugia in the ECTS catalogue page. Unresolved — carry as uncertainty_note if this item is ever revisited."
  - "As of 2026-09-05, nearly all 2026/27 PICA (non-EU-abroad) deadlines have already passed except Geology for Energy Resources (30 Sept 2026). 2027/28 dates will not be published until roughly spring 2027 — deep-research should capture the 2026/27 dates as historical reference and say so explicitly."
  - "PICA call-code drift: several department Regolamenti/PDFs cite an older programme-specific PICA code (e.g. 2026-visa-01) that no longer matches the current central international-students page (2026-visa-02/-03/-04/-06). Treat the central page (unipg.it/en/international-students/becoming-a-unipg-student) as authoritative and flag the mismatch rather than silently picking one."
  - "Quantitative Finance and Data Science for Economics (M0208): the UNIPG course-sheet 'Modalità di ammissione' text does not match its own Regolamento didattico (looks copy-pasted from a different Economics master) — use the Regolamento's 18-CFU/90-110 rule and flag the conflict."
  - "Geology for Energy Resources (M0415): capacity conflict — course sheet says 50 places, the newer 2026-2027 Regolamento says 65. Use 65 and flag the discrepancy."

execution:
  batch_size: 5          # parallel agents per wave (per user decision — session-limit safe)
  items_per_agent: 1
  output_dir: "./perugia-english-programs/results"
  output_format: "one JSON file per item, named {id}.json, fields exactly as fields.yaml"
  agent_model: "sonnet"
  status_2026-09-05: >
    Item list grew from 10 to 13 after a second verification pass found 3 more
    genuine English curricula UNIPG's own classification page omits (Informatica
    AI+Cybersecurity, Amministrazione-Accounting&Finance, and the partial Scienze
    della terra-Geosciences for Environmental Sustainability) and confirmed the 2
    previously-"unverified" Scienze chimiche curricula as real. All 13 items now
    have completed results/ JSON as a byproduct of framework-verification research:
    ba-engineering-management, ma-engineering-management,
    ma-quantitative-finance-data-science-economics, ma-geology-energy-resources,
    ma-agricultural-environmental-biotechnology, ma-medical-veterinary-forensic-biotech,
    ma-civil-engineering-structural, ma-economia-management-international-business,
    ma-scienze-chimiche-tccm, ma-scienze-chimiche-energy-sustainability,
    ma-informatica-ai-cybersecurity, ma-amministrazione-finanza-controllo-accounting-finance,
    ma-geosciences-environmental-sustainability. A light /research-deep pass is still
    worth running to fill remaining per-item gaps flagged in each JSON's
    uncertainty_notes (mainly: exact PICA group for the 7 newly-added English-curriculum
    items, which was not explicitly stated for most of them).
  rules:
    - "Only unipg.it and its department subdomains (*.unipg.it) may be cited. unistrapg.it is a different university and is strictly out of scope."
    - "Re-verify the item's actual teaching language against the live ECTS catalogue course page (courses list -> idcorso=XXXX), not just the classification list — UNIPG's own classification page has an ~50% false-positive rate on Tier 2."
    - "Prioritise A.Y. 2026/2027; if unavailable, use 2025/2026 and say so in uncertainty_notes."
