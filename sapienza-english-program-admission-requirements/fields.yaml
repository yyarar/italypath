# Field definitions for the deep-research phase.
# Each programme (item in outline.yaml) must be researched into one JSON object
# carrying the fields below. Use ONLY official Sapienza University of Rome
# sources (see outline.yaml source_policy).
#
# VERIFICATION ROUND: do not anchor on any prior/cached value for these fields
# (June 2026 dataset, tmp/uni-research/db-snapshots, etc.) — re-derive each
# one from the current official page. Leave a field empty ("") and add a note
# in uncertainty_notes rather than guessing when official information cannot
# be confirmed.
#
# Structure: field_categories is a LIST of { category, description, fields: [...] }
# so it validates directly with ~/.claude/skills/research/validate_json.py.
# Mirrors university-of-genoa-english-program-admission-requirements/fields.yaml
# (the proven 17-field template used across this research project).

field_categories:

  - category: identity
    description: "What the programme is and where it sits."
    fields:
      - name: program_name
        required: true
        description: "Exact official programme name as currently published by Sapienza."
        detail_level: brief
      - name: level
        required: true
        description: "One of: bachelor | master | single-cycle | other."
        detail_level: brief
      - name: teaching_language
        required: true
        description: "Language of instruction (e.g. English; English and Italian). State explicitly; this confirms in-scope status."
        detail_level: brief
      - name: campus
        required: true
        description: "City / campus where the programme is delivered (e.g. Roma, Latina, Rieti, Pomezia)."
        detail_level: brief
      - name: degree_class
        required: true
        description: "Italian degree class code if published (e.g. L-8, LM-32). Leave empty if not stated."
        detail_level: brief

  - category: admission
    description: "How a student gets in."
    fields:
      - name: admission_type
        required: true
        description: "One of: open access | restricted access | TOLC | SAT | selection call | other. Capture the actual access mechanism."
        detail_level: moderate
      - name: academic_requirements
        required: true
        description: "Required prior qualifications, minimum CGPA/grade thresholds, required prior credits (CFU) or subject background."
        detail_level: detailed
      - name: language_requirements
        required: true
        description: "Required English level (e.g. B2) and accepted proofs (IELTS/TOEFL scores, English-medium instruction certificate, exemptions)."
        detail_level: detailed
      - name: entry_exam_or_test
        required: true
        description: "Any required test/exam (TOLC, SAT, admission test, interview) with thresholds if stated."
        detail_level: moderate

  - category: deadlines
    description: "When to apply. Prioritise A.Y. 2026/2027. Programmes may publish their own programme-specific dates on their own pages — check there before falling back to the general Sapienza international admissions calendar."
    fields:
      - name: application_deadline_eu
        required: true
        description: "Application deadline(s) for EU / resident applicants. Note session/round if applicable."
        detail_level: moderate
      - name: application_deadline_non_eu
        required: true
        description: "Application deadline(s) for non-EU applicants requiring a visa, including any programme-specific early closure."
        detail_level: moderate

  - category: documents_and_fees
    description: "What to submit and what it costs."
    fields:
      - name: required_documents
        required: true
        description: "List of documents needed for the application (transcripts, degree, CV, motivation letter, declaration of value, etc.)."
        detail_level: detailed
      - name: tuition_or_fees_link
        required: true
        description: "Official URL to tuition / fees information for the programme (link only; do not invent amounts)."
        detail_level: brief

  - category: sourcing
    description: "Provenance and confidence."
    fields:
      - name: official_program_url
        required: true
        description: "Canonical CURRENT official programme page. May differ from the June 2026 seed URL in outline.yaml — confirm and use the current one."
        detail_level: brief
      - name: official_call_url
        required: true
        description: "URL of the official admission call / bando / selection page for this programme or its degree level."
        detail_level: brief
      - name: source_quotes
        required: true
        description: "Short verbatim quotes from official pages backing the key fields (especially requirements and deadlines), each with its source URL."
        detail_level: detailed
      - name: uncertainty_notes
        required: true
        description: "Anything unconfirmed, conflicting, or assumed — including if the programme appears discontinued, moved, or no longer English-taught. Cite evidence links, do not guess."
        detail_level: moderate

# Reserved field, auto-filled during deep research to flag which fields per item
# could not be confirmed from official sources.
uncertain: []
