topic: "Sapienza University of Rome English-taught degree programme admission requirements — verification round"
research_question: "Re-verify, from official Sapienza sources only, the admission requirements for the 23 fixed English-taught programmes listed below, superseding the low-confidence June 2026 dataset. Prioritise A.Y. 2026/2027 where published."

institution:
  name: "Sapienza University of Rome"
  short_name: "Sapienza"
  official_domains:
    - "uniroma1.it"
    - "corsidilaurea.uniroma1.it"
    - "web.uniroma1.it"

source_policy:
  allowed_sources: >-
    Only official Sapienza sources: corsidilaurea.uniroma1.it course pages,
    web.uniroma1.it department/faculty pages, and official PDF admission
    calls (bando) hosted on uniroma1.it or its subdomains.
  excluded_sources: >-
    Aggregators, agencies, forums, ranking sites, social media, and any
    non-Sapienza pages.
  priority_year: "2026/2027"
  fallback_year: "Use the newest published official academic year when 2026/2027 admission info is not yet available."

# This round supersedes tmp/uni-research/prompts/sapienza-dogrulama-research.md
# (Kerem, 2026-09-02). The prior sapienza-english-program-admission-requirements/
# results were deleted from the working tree on that date as a deliberate reset
# for this verification pass; they remain recoverable from git history
# (commit 7fca18e) if ever needed, but deep research must NOT consult them.
verification_policy:
  round: "verification"
  reason: >-
    The existing dataset for these 23 programmes was collected in June 2026
    and its reliability is low. This round must re-derive every field from
    the current official page — do NOT reuse or anchor on old field values,
    including any cached in tmp/uni-research/db-snapshots.
  fixed_item_list: true
  fixed_item_list_note: >-
    The 23 items below are FIXED. Do not search for or add new programmes,
    and do not remove any of the 23 even if a page looks broken — instead
    mark it in uncertainty_notes with evidence.
  seed_url_caveat: >-
    The official_program_url values below are carried over from June 2026
    and may be broken or moved. Use them as a starting point only; confirm
    (or find the replacement for) the current official URL during deep research.
  not_found_handling: >-
    If a programme no longer exists, or is no longer taught in English,
    do not invent data to fill the fields. State this explicitly in
    uncertainty_notes with a link to the evidence (e.g. the catalogue
    page that no longer lists it, or a page confirming Italian-only teaching).
  program_specific_deadlines_note: >-
    Programmes may carry their own programme-specific admission dates on
    their own official pages, distinct from the general Sapienza calendar.
    Check each programme's own page before falling back to the general
    international admissions calendar.

