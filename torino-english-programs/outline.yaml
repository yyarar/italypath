topic: "University of Turin (UNITO) - İngilizce eğitim veren lisans ve yüksek lisans programları admission requirements"
generated_date: "2026-09-01"

scope:
  official_sources_only: true
  allowed_domains:
    # www.unito.it, en.unito.it, apply.unito.it/courses/search Cloudflare arkasında (403).
    # Deep research aşağıdaki bölüm/program mikrositelerini ve apply.unito.it/en_GB/courses/course/<id>
    # sayfalarını kullanmalı; gerekirse arama motoru cache/snippet üzerinden dolaylı doğrula.
    - international.unito.it   # resmi "English-Taught Programs" hub + kategori sayfaları
    - apply.unito.it           # başvuru portalı: /en_GB/courses/course/<id>-<slug> sayfaları (deadline/requirements kaynağı)
    - unito.it                 # bölüm/program mikrositeleri (*.unito.it, örn. business-management.unito.it, economics.unito.it)
    - en.unito.it               # kurumsal İngilizce sayfalar (Cloudflare arkasında, dikkatli kullan)
    - www.unito.it               # genel/offerta formativa sayfaları (Cloudflare arkasında, dikkatli kullan)
    - digitalskills.polito.it   # İSTİSNA: Digital Skills for Sustainable Societal Transitions - UNITO+PoliTo ortak derecesi,
                                 # kullanıcı kararıyla dahil edildi (bkz. items altında ilgili not)
  excluded_domains:
    - polito.it   # Politecnico di Torino - ayrı üniversite, kapsam dışı (digitalskills.polito.it istisnası hariç)
  admission_year_priority: "2026/2027 varsa öncelik; yoksa UNITO'nun yayınladığı en güncel resmi yıl"
  language_scope_note: >
    UNITO'da üç farklı durum var: (1) tamamen İngilizce program, (2) İtalyanca isimli bir
    derecenin içinde 1-2 dönemlik İngilizce "pathway/curriculum" (örn. Smart Agriculture,
    Viticultural and Enological Sciences, Animal Nutrition and Feed Safety, Urban and
    Political Geography, Philosophy/PIC), (3) UNITO+başka üniversite ortak (interuniversity)
    dereceler. Pathway programlar kullanıcı kararıyla dahil edildi ancak uncertainty_notes'ta
    "tam program değil, İngilizce pathway/curriculum" notu düşülmeli. Digital Skills for
    Sustainable Societal Transitions (UNITO+PoliTo ortak, idari sayfası polito.it) kullanıcı
    kararıyla dahil edildi. Geosciences for Global Changes and Sustainability ("mainly in
    English", resmi listede yok) kullanıcı kararıyla kapsam dışı bırakıldı.

