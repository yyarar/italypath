excluded_from_scope:
  - name: "International Trade, Legality and Corporate Social Responsibility (ITCSR)"
    reason: "Laurea magistrale olarak bulunamadı. UNITO'da benzer isimli sadece profesyonel 'Master in International Trade Law' var (1./2. seviye master, akademik derece değil) - kapsam dışı."
  - name: "Data Science for Complex Economic Systems (DSCES / MADAS)"
    reason: "Collegio Carlo Alberto'ya ait (carloalberto.org), UNITO değil; ayrıca program askıya alınmış."
  - name: "Physics of Complex Systems"
    reason: "UNITO'daki 'Fisica dei sistemi complessi' İtalyanca eğitim veriyor. İngilizce 'Physics of Complex Systems' aslında Politecnico di Torino'ya ait - kapsam dışı."
  - name: "Corporate Communication"
    reason: "Bu isimde UNITO programı bulunamadı. En yakın 'Communication and Media Cultures' İtalyanca eğitim veriyor."
  - name: "Global Cultures"
    reason: "UNITO'da bulunamadı; bu isim Bologna Üniversitesi'ne ait."
  - name: "Geosciences for Global Changes and Sustainability"
    reason: "apply.unito.it 'mainly in English' diyor (tam İngilizce değil) ve resmi İngilizce-program listesinde yok. Kullanıcı kararıyla kapsam dışı bırakıldı."

execution:
  batch_size: 5
