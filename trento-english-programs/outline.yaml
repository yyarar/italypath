    # www.unitn.it ve corsi.unitn.it doğrudan Cloudflare/AWS WAF arkasında (403/405).
    # Deep research bu alt alan adlarını kullanmalı; corsi.unitn.it linkleri
    # gerektiğinde arama motoru cache/snippet üzerinden veya orienta/webapps
    # üzerinden dolaylı doğrulanmalı.
    - orienta.unitn.it        # resmi 2026/2027 tam program listesi (L/LM kodları, numero programmato işareti)
    - webapps.unitn.it        # Apply portalı: canlı başvuru pencereleri ve son tarihler
    - disi.unitn.it           # Dip. Informatica: bachelor/master listeleri
    - dii.unitn.it            # Dip. Ingegneria Industriale: master listesi
    - dicam.unitn.it
    - cibio.unitn.it
    - economia.unitn.it
    - giurisprudenza.unitn.it
    - sociologia.unitn.it
    - sis.unitn.it            # School of International Studies
    - centro3a.unitn.it       # C3A - Agriculture, Food and Environment
    - corsi.unitn.it          # program detay sayfaları (WAF arkasında, dikkatli kullan)
    - www.unitn.it            # genel sayfalar (Cloudflare arkasında, dikkatli kullan)
  admission_year_priority: "2026/2027 varsa öncelik; yoksa UNITN'in yayınladığı en güncel resmi yıl"
  language_scope_note: >
    UNITN'de üç farklı durum var: (1) tamamen İngilizce program, (2) İtalyanca
    bir programın İngilizce "percorso"su (örn. 4 lisans programı), (3) resmi
    listede İngilizce işaretli ama program sayfasında "English and Italian"
    yazan karma programlar (Civil Engineering, Environmental and Land
    Engineering, Global Affairs). Karma programlar item listesine dahil edildi
    ancak uncertainty_notes'ta açıkça işaretlenmeli; nihai kapsam kararı
    deep-research sonrası verilecek.

