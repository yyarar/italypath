# UNIBZ araştırması — alan tanımları
# Çekirdek 17 alan Kerem'in brief'inden; ek alanlar web doğrulama ajanının unibz.it bulgularından.
# detail_level: brief -> moderate -> detailed
# Derin araştırma aşamasında her program için bu şemaya uygun JSON üretilecek.

fields:

  # ---------- 1. KİMLİK VE ERİŞİLEBİLİRLİK ----------
  identity:
    - name: program_name
      description: "Programın resmi tam adı (unibz.it'teki İngilizce ad)"
      detail_level: brief
      core: true
    - name: level
      description: "bachelor / master / single-cycle / other"
      detail_level: brief
      core: true
    - name: teaching_language
      description: "Tam İngilizce mi, üç dilli (IT/DE/EN) mi; üç dilliyse hangi dillerin hangi ağırlıkta olduğu"
      detail_level: moderate
      core: true
    - name: campus
      description: "Kampüs/lokasyon. Dikkat: 5+ lokasyon var — Bolzano ana kampüs, NOI Techpark Bolzano, Brixen-Bressanone, Bruneck-Brunico, ayrıca Trento (Energy) ve Innsbruck (EMMA 2. yıl)"
      detail_level: brief
      core: true
    - name: degree_class
      description: "İtalyan degree class kodu (L-31, LM-18 vb.). Yeni 'LM-Data' gibi 2024 sonrası sınıflar da geçerli"
      detail_level: brief
      core: true
    - name: offered_in_2026_27
      description: "Program 2026/27'de açık mı? (Wood Technology ve Tourism Management sitede var ama açılmıyor — bu alan olmadan veri seti yanıltır)"
      detail_level: brief
    - name: is_new_programme
      description: "Yeni program mı, ilk alım yılı (örn. Informatics and Management of Digital Business — 2026)"
      detail_level: brief
    - name: majors_tracks_study_plans
      description: "Major/track/study plan varyantları (Design vs Art majörleri, Industrial Mechanical Engineering'in 5 study plan'ı, dual-study 4 yıllık varyant vb.)"
      detail_level: moderate
    - name: english_only_accessibility
      description: "Sadece İngilizce bilen aday için erişilebilirlik: open / partially-open / effectively-closed (örn. C1 Almanca/İtalyanca isteyen üç dilli programlar fiilen kapalı)"
      detail_level: moderate

  # ---------- 2. KABUL (ADMISSION) ----------
  admission:
    - name: admission_type
      description: "open access / restricted access / TOLC / SAT / selection call / interview / portfolio / other — birden fazla olabilir"
      detail_level: moderate
      core: true
    - name: academic_requirements
      description: "Akademik önkoşullar: lise diploması şartları (lisans) veya lisans derecesi + zorunlu ECTS/SSD kredileri (yüksek lisans). SSD kodları 2024 reformuyla yenilendi (INFO-01/A vb.) — yeni kod + eski karşılığı birlikte kaydedilmeli"
      detail_level: detailed
      core: true
    - name: entry_exam_or_test
      description: "Giriş sınavı seçenekleri — LİSTE olarak: unibz kendi sınavı VEYA TOLC-I VEYA CENT-S (mühendislik lisansları) — her birinin kendi sınav tarihi var"
      detail_level: detailed
      core: true
    - name: selection_scoring
      description: "Puanlama rubrigi + geçme eşiği (örn. Design 42/100, Critical Creative Practices 60/100, EMMA 55/95, Entrepreneurship 70/100) + min not ortalaması (örn. Software Eng 24/30, Energy Eng 22/30)"
      detail_level: detailed
    - name: bonus_points
      description: "Bonus puanlar: Webometrics üniversite sıralaması bonusu (Software Eng / Computing for Data Science: ilk 1000 = 3p, 1001-2000 = 2p, 2001-3000 = 1p), GMAT/GRE bonusu (Accounting and Finance), startup proje sunumu (Entrepreneurship 30p)"
      detail_level: moderate
    - name: portfolio_and_materials
      description: "Portfolyo/video/proje önerisi/motivasyon mektubu şartları ve format limitleri (portfolyo maks 20 MB PDF, proje önerisi maks 2 A4, motivasyon mektubu maks 6.000 karakter, video maks 2 dk)"
      detail_level: detailed
    - name: interview
      description: "Mülakat var mı, yayınlanmış mülakat tarihleri (örn. Computing for Data Science eşik altı adaylar: 22 ve 26 Mayıs 2026)"
      detail_level: moderate
    - name: conditional_admission
      description: "Henüz mezun olmayanlar için koşullu kabul: ≥120 ECTS (Data Analytics için 140); kayıt tarihine kadar diploma yoksa hak düşer, yer kalırsa 11/12/2026'ya kadar geç kayıt"
      detail_level: moderate
    - name: ofa_rules
      description: "OFA (ek öğrenme yükümlülüğü): zorunlu matematik testinden kalanlara atanır (Economics and Management, Economics Politics and Ethics, Tourism Sport and Event Management)"
      detail_level: brief

  # ---------- 3. DİL ŞARTLARI ----------
  language:
    - name: language_requirements
      description: "Genel dil şartları özeti (çekirdek alan)"
      detail_level: detailed
      core: true
    - name: entry_levels_by_position
      description: "Giriş seviyeleri 1./2./3. dil pozisyonuna göre (dile göre değil): örn. B2/B2/yok (Computer Science), B2/B1/yok (Electronic Eng), C1/B2/yok (Public Policy, Accounting and Finance)"
      detail_level: detailed
    - name: exit_levels
      description: "Mezuniyet dil şartı (tipik C1/C1/B2) — mezun olabilmeyi doğrudan etkiler"
      detail_level: moderate
    - name: third_language_exam_threshold
      description: "3. dilde B1 şartı — genelde 1. yılın 2. döneminden itibaren sınavlara girebilmek için"
      detail_level: brief
    - name: proof_pathways
      description: "4 kabul yolu: lise son yılın eğitim dili / İngilizce eğitim veren önceki diploma / tanınan sertifika / unibz Language Centre sınavı (kayıt pencereleri ve sınav tarihleri dahil, örn. 16/03/2026, 16-17 ve 20-21/04/2026, 22-26/06/2026)"
      detail_level: detailed
    - name: certificate_rules
      description: "Sertifika geçerlilik kuralları (University Council Resolution 16/2026): maks 5 yıl eski, 4 beceri, EN DÜŞÜK alt beceri seviyeyi belirler, telafi yok, 'home edition' online sınavlar ve DAAD tanınmıyor"
      detail_level: detailed

  # ---------- 4. TARİHLER VE KONTENJAN ----------
  deadlines:
    - name: application_deadline_eu
      description: "AB adayları için başvuru son tarihleri — 3 oturum ayrı ayrı: Early Bird / Late Application / Additional Session (ISO formata normalize; unibz GG/AA/YYYY yazar!)"
      detail_level: detailed
      core: true
    - name: application_deadline_non_eu
      description: "AB dışı (yurt dışında yaşayan) adaylar için TEK başvuru penceresi (ISO format)"
      detail_level: detailed
      core: true
    - name: parity_of_treatment
      description: "AB muamelesi görenler: Norveç, İzlanda, Lihtenştayn, İsviçre, San Marino, Vatikan + çalışma/aile/insani oturum izinli AB dışı vatandaşlar (öğrenci/turist izni SAYILMAZ) — Türk adaylar için kritik üçüncü kategori"
      detail_level: moderate
    - name: places_quotas
      description: "Kontenjanlar 3 ayrı sayı: AB Early Bird / AB Late / AB dışı (örn. Computing for Data Science: 20+10 AB, 30 AB dışı)"
      detail_level: moderate
    - name: ranking_and_enrolment_dates
      description: "Sıralama listesi ilan tarihi (örn. 27/05, 30/07, 18/09/2026), yeri garantileyen 1. taksit ödeme son tarihi (örn. 05/06, 06/08, 25/09/2026), kayıt penceresi (örn. 10/07-13/10/2026, programa göre değişir)"
      detail_level: detailed
    - name: programme_specific_dates
      description: "Programın kendi sayfasındaki/PDF'indeki programa özel sınav, mülakat, portfolyo teslim tarihleri (Kerem'in notu: programların kendine özel admission tarihleri olabiliyor)"
      detail_level: detailed

  # ---------- 5. BELGELER, ÜCRETLER, FİNANS ----------
  documents_fees:
    - name: required_documents
      description: "Gerekli belgeler listesi (çekirdek alan) — study career Excel şablonu (zorunlu yapılandırılmış yükleme) dahil"
      detail_level: detailed
      core: true
    - name: application_fee
      description: "Başvuru ücreti: sadece yurt dışında yaşayan AB dışı adaylar için 50 €, iade edilmez"
      detail_level: brief
    - name: tuition_or_fees_link
      description: "Harç sayfası linki + özet: ~1.200 €/yıl (2 x 600 €), 1. taksitte 16 € damga pulu, 2. taksit Mart'a kadar"
      detail_level: moderate
      core: true
    - name: scholarships_grants
      description: "Burslar: bölgesel burs 1.680-6.960 €/yıl (AB dışı ilk yıl fiilen erişemez — 1 yıl kesintisiz Güney Tirol ikameti şartı), 1. yıl sonrası 27/30 ortalamayla liyakat bursu, programa özel burslar"
      detail_level: moderate
    - name: credential_recognition
      description: "Diploma tanıma yolu: ARDI Statement of Correspondence (Lizbon Konvansiyonu ülkeleri) vs CIMEA Statement of Comparability + her iki durumda CIMEA Verification; Almanca/İngilizce değilse İtalyanca çeviri; yüksek lisansta ≥180 ECTS kanıtı"
      detail_level: detailed
    - name: non_eu_visa_process
      description: "Universitaly ön kaydı (1. taksit sonrası ZORUNLU, tek program seçilebilir), vize için geçim kanıtı (≥800 €/ay; lisans toplam ≥36.000 €, yüksek lisans ≥24.000 €), varıştan sonra 8 iş günü içinde oturum izni, çalışma 20 saat/hafta limiti"
      detail_level: detailed

  # ---------- 6. KAYNAK VE META ----------
  sources_meta:
    - name: official_program_url
      description: "Resmi program sayfası (unibz.it)"
      detail_level: brief
      core: true
    - name: official_call_url
      description: "Resmi çağrı/manifesto/call linki varsa"
      detail_level: brief
      core: true
    - name: admission_information_pdf_url
      description: "BİRİNCİL KAYNAK: /assets/CoursesPDF/<slug>_admission-information_en_GB.pdf — HTML sayfadan daha zengin ve tutarlı"
      detail_level: brief
    - name: brochure_pdf_url
      description: "/assets/CoursesPDF/<slug>_brochure_en_GB.pdf"
      detail_level: brief
    - name: ranking_list_url
      description: "Yayınlanmış sıralama listeleri (/assets/Documents/Ranking-Lists/...) — rekabet düzeyi sinyali"
      detail_level: brief
    - name: source_quotes
      description: "Kritik iddiaların doğrudan alıntıları (tarih, kontenjan, eşik puan gibi alanlar için zorunlu)"
      detail_level: moderate
      core: true
    - name: uncertainty_notes
      description: "Belirsizlikler: hangi yılın verisi, çelişen bilgi, sadece Almanca sayfa vb."
      detail_level: moderate
      core: true
    - name: last_verified_date
      description: "Doğrulama tarihi — tarih ve kontenjanlar her döngüde değişir"
      detail_level: brief

# Derin araştırma aşamasında otomatik doldurulacak belirsiz alanlar (rezerve)
uncertain: []
