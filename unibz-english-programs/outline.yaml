# programlarının admission requirements araştırması
# Oluşturulma: 2026-08-29 | Kaynak kısıtı: sadece resmi unibz.it sayfaları

topic: "UNIBZ İngilizce eğitim veren lisans ve yüksek lisans programları — admission requirements (2026/2027)"

scope:
  source_restriction: "Sadece unibz.it resmi sayfaları ve unibz.it üzerindeki resmi PDF'ler"
  academic_year: "2026/2027 öncelikli; bilgi yoksa en güncel resmi yıl kullanılır ve notlanır"
  language_scope: "Tam İngilizce VE üç dilli (EN/DE/IT) programların tümü dahil; teaching_language alanında ayrım net yazılır"
  note_program_specific_dates: "Programların kendine özel admission tarihleri olabilir; her programın kendi sayfası ve admission-information PDF'i esas alınır"

research_guidelines:
  primary_source: "Her programın /assets/CoursesPDF/<slug>_admission-information_en_GB.pdf dosyası HTML sayfadan daha zengin ve tutarlı — öncelikli kaynak bu PDF olmalı"
  date_format: "unibz tarihleri GG/AA/YYYY yazar (02/03/2026 = 2 Mart). Çıktıda ISO (YYYY-MM-DD) formatına normalize edilecek"
  session_model: "Başvuru döngüsü 3 kademeli: Early Bird, Late Application (sadece AB), Additional Session (sadece AB, yer kalırsa). AB dışı adayların (yurt dışında yaşayan) tek başvuru penceresi var"
  parity_of_treatment: "Norveç, İzlanda, Lihtenştayn, İsviçre, San Marino, Vatikan + geçerli çalışma/aile/insani oturum iznine sahip AB dışı vatandaşlar AB gibi işlem görür (öğrenci/turist izni sayılmaz)"

