# ---------------------------------------------------------------
# KAPSAM DIŞI BIRAKILANLAR (veri setinin eksiksizliği kanıtlansın diye kayıtlı)
# ---------------------------------------------------------------
excluded_items:
  - name: "Master in Primary Education (tek döngü, 5 yıl, LM-85bis)"
    reason: "Eğitim dili İtalyanca/Almanca/Ladince bölümler — İngilizce eğitim yok"
  - name: "Executive/professional masterlar (7 adet: Fire Safety Engineering, Geo-hydrological Risk, FOAM, HR Management, European Public Administration, EDENSPACES, COST)"
    reason: "Standart lisans/yüksek lisans admission döngüsünün dışında; kendi ücret/tarih yapıları var. İstenirse ayrı araştırma olarak eklenebilir"

# ---------------------------------------------------------------
# YÜRÜTME AYARLARI (/research-deep bunları okur)
# ---------------------------------------------------------------
execution:
  batch_size: 5          # aynı anda en fazla 5 paralel agent (limit güvenliği)
  items_per_agent: 1     # her agent tek programı derinlemesine araştırır
  output_dir: "./results"
