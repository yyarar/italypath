# outline.yaml — research items + execution config
topic: "UNIME English-taught bachelor & master programmes — admission requirements"
topic_slug: "unime-english-programs"
university: "Università degli Studi di Messina (UNIME)"
academic_year_target: "2026/2027"
academic_year_fallback: "2025/2026"
generated_at: "2026-09-04"

source_of_item_list:
  page: "https://international.unime.it/study-us/english-taught-programmes"
  pdf: "https://international.unime.it/sites/sten/files/2025-04/Degree_Programmes_EN_Contacts.pdf"
  note: >
    Official UNIME list of fully English-taught degree programmes, A.Y. 2026/2027.
    18 programmes listed (7 bachelor, 1 single-cycle, 10 master). Two are newly accredited for 2026/27 and have no live
    micro-site yet (info-sheet PDF only): Heritage Innovation Engineering, Global Security Studies.

access_warning: >
  www.unime.it and international.unime.it sit behind an AWS WAF interactive CAPTCHA that
  blocks automated fetching. The item list above was recovered from Wayback Machine snapshots
  of the official unime.it pages (May 2026). The individual *.cdl.unime.it programme sites
  appear reachable. Deep-research agents MUST NOT solve the CAPTCHA; when a page is blocked,
  they should try the *.cdl.unime.it site, the linked PDF, or a Wayback snapshot of the
  official unime.it URL, and record the access route in uncertainty_notes.

shared_reference_pages:
  application_and_admission: "https://international.unime.it/study-us/application-and-admission"
  entry_criteria_by_country_pdf: "https://www.unime.it/sites/default/files/2025-11/UniME%20Entry%20Criteria%20by%20Country.pdf"
  note: >
    UNIME's 2026/27 intake runs in six sequential calls (1st Early Bird, 2nd & 3rd Visa
    Applicant calls, 4th Semestre Aperto, 5th Medicine/IMAT call, 6th No-Visa/EU call),
    each with its own eligible group and date window, plus a non-refundable €30 application
    fee. Deep-research agents must list EVERY applicable round inside
    application_deadline_eu / application_deadline_non_eu rather than a single date, and
    note the two-portal flow (UniME Application Portal, then Universitaly confirmation).

