excluded_candidates:
  - name: "Biomedical Sciences / Biological Sciences (bachelor)"
    reason: "Not on the official English-taught list; no English-taught equivalent at UNIME."
  - name: "Chemical / Materials Science master in English"
    reason: "Does not exist. Nearest is Physics: Material Physics and Devices."
  - name: "Sustainable Agriculture / Food Science master"
    reason: "No agriculture or food-science programme on the official English-taught list."
  - name: "Marine Biology as a master's"
    reason: "Wrong level — it is a bachelor's (Marine Biology and Blue Biotechnologies)."

execution:
  batch_size: 5          # parallel agents per wave
  items_per_agent: 3     # 18 items -> 6 agents -> 2 waves (5 + 1) — COMPLETED 2026-09-04
  output_dir: "./unime-english-programs/results"
  output_format: "one JSON file per item, named {id}.json, fields exactly as fields.yaml"
  agent_model: "sonnet"
  rules:
    - "Only unime.it and *.unime.it sources may be cited."
    - "Never solve a CAPTCHA; fall back to cdl.unime.it site, PDF, or Wayback snapshot and log the route."
    - "Prioritise A.Y. 2026/2027; if unavailable, use 2025/2026 and say so in uncertainty_notes."
    - "Leave a field null rather than guessing; every null must be explained in uncertainty_notes."
    - "Back deadlines, language level and admission type with verbatim quotes in source_quotes."
