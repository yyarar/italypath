# ============================================================================
# TUM PROGRAMLAR ICIN ORTAK ADMISSION CERCEVESI (on-dogrulandi)
# Kaynak: https://www.unitus.it/en/join-unitus/how-to-enroll/ (2026/2027)
# Derin arastirmada her program icin tekrar aranmasin, sadece program-ozel sapmalar aransin.
# ============================================================================
shared_admission_baseline:
  english_language_requirement: >
    Ingilizce yurutulen programlar icin CEFR B2. Kabul edilen sertifikalar: IELTS, TOEFL,
    TCL, Cambridge First, PTE Academic, Oxford Test of English, Aptis ESOL General/Advanced.
    Alternatif: onceki universite ogreniminin Ingilizce yurutuldugune dair EMI belgesi.
    Ingilizce programlar icin Italyanca sinavi ISTENMEZ.
  italian_language_requirement: >
    Italyanca yurutulen programlar icin Italyanca B2 zorunlu (CISIA Italyanca testi min. 50 puan
    alternatif). Not: 2026 icin tum CISIA tarihleri dolu ilan edilmis.
  admission_mechanism: >
    DOGRULANDI: Incelenen tum LM programlari didaktik yonetmeliklerinde "ad accesso libero"
    (OPEN ACCESS). Numero programmato YOK, TOLC YOK (TOLC sadece kontenjanli lisans programlarinda).
    Surec: online basvuru formu -> ZORUNLU SOZLU MULAKAT (oral interview) -> admission letter.
    Bu yuzden program-ozel bando/cagri YAYINLANMIYOR - official_call_url cogu programda null olacak,
    yerine didaktik yonetmelik PDF'i verilmeli.
    admission_type alani icin dogru deger: "open access" (+ mulakat notu), "selection call" DEGIL.
  deadlines_reality: >
    UNITUS program bazli BASVURU son tarihi yayinlamiyor (surec rolling), ama universite capinda
    KESIN KAYIT takvimi var. Kaynak: TUITION-FEES-AND-CONTRIBUTIONS-REGULATIONS_2026-2027.pdf
  official_calendar_2026_2027:
    enrolment_opens: "2026-08-01 (tum dereceler)"
    deadline_bachelor_and_master_year2plus: "2026-11-04 (+ 1. taksit)"
    deadline_master_first_year: "2026-12-29  <-- ILK YIL YUKSEK LISANS ICIN OPERATIF SON TARIH"
    extension_jan_feb_graduates: "2027-02-28"
    non_eu_visa_deadline: "2026-11-30 (konsolosluga vize basvurusu son tarihi)"
    non_eu_onsite_enrolment_opens: "2026-08-01 (International Students Desk)"
    universitaly_preenrolment: "2026/27 icin ACIK; Universitaly genelde Nisan/Mayis'ta aciyor"
    rule: >
      deadline alanlarina yazilacak format:
      "No programme-specific application deadline (rolling). Enrolment 2026-08-01 to 2026-12-29
      (1st-year Master's). Non-EU visa cutoff 2026-11-30." Tarih uydurma, bos birakma.
  required_documents_baseline:
    - Lise diplomasi (onayli kopya + Apostil/legalizasyon + onayli Italyanca ceviri VEYA CIMEA Statement of Verification)
    - En az 3 yillik lisans derecesi (ayni legalizasyon secenekleri)
    - Transcript of Records
    - Declaration of Value (konsolosluk) VEYA CIMEA Statement of Comparability VEYA ARDI Statement of Correspondence
    - Diploma Supplement (legalize ise DoV yerine gecebilir)
    - Dil sertifikasi veya EMI belgesi
    - Admission letter
  visa_financial_proof: "Yillik 10.179,85 EUR maddi yeterlilik belgesi"
  fees:
    page: https://www.unitus.it/en/students/fees-and-contributions/
    regulations_pdf: https://www.unitus.it/wp-content/uploads/2026/07/TUITION-FEES-AND-CONTRIBUTIONS-REGULATIONS_2026-2027.pdf
    country_band_annex: https://www.unitus.it/wp-content/uploads/2026/07/All.1_-Paesi_studenti-internazionali_2026_2027.pdf
    simulator: https://www.unitus.it/en/students/fees-and-contributions/tuition-fee-simulator/
    model: "ISEEUP gelir bazli. ISEEUP beyan etmeyen ogrenci mense ulkeye gore sabit ucret oder."
    non_eu_flat_bands: "4 ulke bandi: 600 / 1.050 / 1.500 / 1.950 EUR yillik (Annex 1 ulke listesi)"

