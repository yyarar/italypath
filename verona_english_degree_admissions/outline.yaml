  official_domain: "univr.it"
  source_policy: "Use only official University of Verona pages and documents hosted on univr.it or its official corsi.univr.it subdomain."
  programme_rule: "Include degree programmes officially identified as fully taught in English; exclude programmes that merely have an English web page or only some English modules."
